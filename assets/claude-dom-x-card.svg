<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="claude-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f0c" />
      <stop offset="40%" stop-color="#1c1410" />
      <stop offset="80%" stop-color="#0e0b09" />
      <stop offset="100%" stop-color="#050403" />
    </linearGradient>

    <!-- Claude Warm Terracotta Card Gradient -->
    <linearGradient id="claude-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(217, 119, 6, 0.16)" />
      <stop offset="100%" stop-color="rgba(30, 20, 16, 0.85)" />
    </linearGradient>

    <!-- Chrome Card Gradient -->
    <linearGradient id="chrome-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.14)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>

    <!-- Warm Claude Coral Accent -->
    <linearGradient id="claude-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-terracotta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="warm-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(251, 146, 60, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="580" rx="16" fill="url(#claude-bg)" stroke="rgba(234, 88, 12, 0.25)" stroke-width="1.5" />
  <rect width="1200" height="580" rx="16" fill="url(#warm-grid)" />

  <!-- Ambient Light Halos -->
  <circle cx="280" cy="280" r="260" fill="rgba(234, 88, 12, 0.09)" filter="url(#glow-terracotta)" />
  <circle cx="940" cy="280" r="260" fill="rgba(16, 185, 129, 0.08)" filter="url(#glow-emerald)" />

  <!-- Top Hero Header -->
  <g transform="translate(60, 36)">
    <!-- Claude Extension Badge Icon -->
    <rect x="0" y="2" width="44" height="44" rx="12" fill="rgba(234, 88, 12, 0.18)" stroke="#ea580c" stroke-width="1.8" />
    <!-- Stylized Eye / Aperture Motif -->
    <circle cx="22" cy="24" r="11" fill="none" stroke="#f97316" stroke-width="2.5" />
    <circle cx="22" cy="24" r="4.5" fill="#fbbf24" filter="url(#glow-terracotta)" />

    <!-- Header Titles -->
    <text x="58" y="26" class="font-sans" font-weight="900" font-size="28px" fill="#ffffff" letter-spacing="-0.5px">DOM_X</text>
    <text x="180" y="24" class="font-sans" font-weight="500" font-size="16px" fill="#78716c">|</text>
    <text x="195" y="25" class="font-sans" font-weight="700" font-size="16px" fill="#fb923c" letter-spacing="-0.2px">The Chrome Extension &amp; MCP Cortex for Claude</text>
    
    <text x="58" y="46" class="font-sans" font-weight="400" font-size="13.5px" fill="#a8a29e">
      Gives Claude Desktop &amp; Claude Code real-time visual perception of your active browser &mdash; $0.00 cost, 5ms latency, zero hallucinations.
    </text>

    <!-- Top Right Pills -->
    <g transform="translate(740, 2)">
      <!-- Claude Badge -->
      <rect x="0" y="0" width="138" height="28" rx="14" fill="rgba(234, 88, 12, 0.16)" stroke="rgba(249, 115, 22, 0.45)" stroke-width="1" />
      <circle cx="16" cy="14" r="5" fill="#f97316" />
      <text x="28" y="18" class="font-sans" font-size="12px" font-weight="700" fill="#fdba74">Claude MCP Ready</text>

      <!-- Chrome Extension Badge -->
      <rect x="148" y="0" width="132" height="28" rx="14" fill="rgba(56, 189, 248, 0.14)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
      <circle cx="164" cy="14" r="5" fill="#38bdf8" />
      <text x="176" y="18" class="font-sans" font-size="12px" font-weight="700" fill="#7dd3fc">Chrome Ext V3</text>

      <!-- Zero Cost Badge -->
      <rect x="290" y="0" width="90" height="28" rx="14" fill="rgba(16, 185, 129, 0.16)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="1" />
      <circle cx="304" cy="14" r="5" fill="#10b981" />
      <text x="315" y="18" class="font-sans" font-size="12px" font-weight="700" fill="#6ee7b7">$0.00 Cost</text>
    </g>
  </g>

  <!-- Left Card: Claude Desktop Chat Interface -->
  <g transform="translate(60, 110)">
    <rect width="520" height="420" rx="14" fill="url(#claude-card)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 506 0 Q 520 0 520 14 L 520 38 L 0 38 Z" fill="rgba(38, 26, 20, 0.95)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    <text x="260" y="24" text-anchor="middle" class="font-sans" font-size="12.5px" font-weight="600" fill="#d6d3d1">Claude Desktop &bull; Browser Session</text>

    <!-- Chat Messages -->
    <g transform="translate(22, 56)">
      <!-- User Message Bubble -->
      <g transform="translate(60, 0)">
        <rect width="418" height="52" rx="12" fill="rgba(255, 255, 255, 0.07)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
        <text x="16" y="22" class="font-sans" font-size="13px" font-weight="600" fill="#f5f5f4">User</text>
        <text x="16" y="40" class="font-sans" font-size="12.5px" fill="#e7e5e4">"Look at my active Chrome tab and buy the Keychron keyboard."</text>
      </g>

      <!-- Claude Tool Call Indicator -->
      <g transform="translate(0, 68)">
        <rect width="360" height="26" rx="6" fill="rgba(234, 88, 12, 0.15)" stroke="rgba(249, 115, 22, 0.35)" stroke-width="1" />
        <text x="12" y="17" class="font-mono" font-size="11px" fill="#fb923c">⚡ domx.vlm_perceive() &rarr; 18 elements detected in 6.2ms</text>
      </g>

      <!-- Claude Response Bubble -->
      <g transform="translate(0, 106)">
        <rect width="478" height="150" rx="12" fill="rgba(28, 20, 16, 0.9)" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1" />
        <rect x="14" y="14" width="22" height="22" rx="6" fill="#ea580c" />
        <text x="21" y="29" class="font-sans" font-size="12px" font-weight="900" fill="#ffffff">C</text>
        <text x="44" y="28" class="font-sans" font-size="13px" font-weight="700" fill="#fdba74">Claude</text>
        
        <text x="16" y="58" class="font-sans" font-size="12px" fill="#e7e5e4">I analyzed the live page layout. I located the target item:</text>
        
        <!-- Detected Element Tag -->
        <rect x="16" y="70" width="446" height="34" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <text x="26" y="91" class="font-mono" font-size="11.5px" fill="#34d399">@e4 [BUTTON] "Add to Cart - $199" &bull; center(740, 310)</text>

        <text x="16" y="126" class="font-sans" font-size="12px" fill="#cbd5e1">Executing click via <tspan fill="#38bdf8" font-family="ui-monospace">domx.click_element("@e4")</tspan> &mdash; Cart updated in 8ms!</text>
      </g>

      <!-- Telemetry Footer inside Claude -->
      <g transform="translate(0, 274)">
        <rect width="478" height="66" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
        <text x="16" y="24" class="font-mono" font-size="11.5px" fill="#a8a29e">Tokens Used: <tspan fill="#34d399" font-weight="bold">240 tokens</tspan> (vs 6,200 screenshot)</text>
        <text x="16" y="48" class="font-mono" font-size="11.5px" fill="#a8a29e">Perception Cost: <tspan fill="#34d399" font-weight="bold">$0.00</tspan> &bull; Latency: <tspan fill="#38bdf8" font-weight="bold">6.2ms</tspan></text>
      </g>
    </g>
  </g>

  <!-- Right Card: Chrome Extension with Live HUD Overlay -->
  <g transform="translate(620, 110)">
    <rect width="520" height="420" rx="14" fill="url(#chrome-card)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Chrome Tab Header -->
    <path d="M 0 14 Q 0 0 14 0 L 506 0 Q 520 0 520 14 L 520 38 L 0 38 Z" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#ef4444" />
    <circle cx="36" cy="19" r="5" fill="#f59e0b" />
    <circle cx="52" cy="19" r="5" fill="#10b981" />
    
    <!-- Chrome URL Bar -->
    <rect x="70" y="9" width="310" height="20" rx="5" fill="rgba(0, 0, 0, 0.5)" />
    <text x="82" y="23" class="font-mono" font-size="10.5px" fill="#94a3b8">https://store.mechanical.io/keychron</text>
    
    <!-- DOM_X Extension Icon Active in Toolbar -->
    <rect x="390" y="8" width="22" height="22" rx="5" fill="#ea580c" />
    <circle cx="401" cy="19" r="4" fill="#fbbf24" />
    <circle cx="425" cy="19" r="3.5" fill="#10b981" filter="url(#glow-emerald)" />

    <!-- Simulated Live Page with Live HUD Bounding Boxes -->
    <g transform="translate(20, 52)">
      <!-- Page Navigation Header -->
      <rect width="480" height="34" rx="6" fill="rgba(30, 41, 59, 0.5)" />
      <text x="14" y="22" class="font-sans" font-size="12px" font-weight="700" fill="#f1f5f9">KEYBOARDS.IO</text>
      
      <!-- HUD Tag: Sign In -->
      <g transform="translate(370, 6)">
        <rect width="94" height="22" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.2" />
        <rect x="0" y="0" width="32" height="12" rx="2" fill="#0891b2" />
        <text x="3" y="9" class="font-mono" font-size="8px" font-weight="bold" fill="#ffffff">@e1</text>
        <text x="36" y="15" class="font-sans" font-size="10px" fill="#67e8f9">Sign In</text>
      </g>

      <!-- Product Section -->
      <rect x="10" y="50" width="120" height="90" rx="8" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.05)" />
      <text x="60" y="100" text-anchor="middle" class="font-sans" font-size="28px">⌨️</text>

      <!-- Product Title & Info -->
      <text x="146" y="68" class="font-sans" font-size="15px" font-weight="700" fill="#ffffff">Keychron Q1 Pro Wireless</text>
      <text x="146" y="88" class="font-sans" font-size="12px" fill="#94a3b8">Fully customizable mechanical keyboard</text>
      <text x="146" y="112" class="font-sans" font-size="15px" font-weight="800" fill="#34d399">$199.00</text>

      <!-- HUD TARGET BOX: Add to Cart Button (@e4) -->
      <g transform="translate(146, 126)">
        <!-- Pulsing Bounding Box Frame -->
        <rect x="-4" y="-4" width="228" height="40" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" />
        <!-- Set-of-Mark Coordinate Pill -->
        <rect x="-4" y="-20" width="168" height="16" rx="3" fill="#059669" />
        <text x="2" y="-8" class="font-mono" font-size="9.5px" font-weight="bold" fill="#ffffff">@e4 BUTTON &bull; (740, 310)</text>

        <!-- Actual Button Surface -->
        <rect width="220" height="32" rx="4" fill="#059669" />
        <text x="110" y="20" text-anchor="middle" class="font-sans" font-size="12px" font-weight="700" fill="#ffffff">Add to Cart - $199</text>

        <!-- Crosshair Reticle where Claude Clicks -->
        <circle cx="110" cy="16" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
        <path d="M 110 6 L 110 26 M 100 16 L 120 16" stroke="#ffffff" stroke-width="1.5" />
      </g>

      <!-- Privacy Shield Demo Box -->
      <g transform="translate(10, 196)">
        <rect width="460" height="74" rx="8" fill="rgba(239, 68, 68, 0.08)" stroke="rgba(239, 68, 68, 0.3)" stroke-width="1" />
        <rect x="14" y="12" width="180" height="18" rx="4" fill="#b91c1c" />
        <text x="22" y="25" class="font-mono" font-size="10px" font-weight="bold" fill="#ffffff">🔒 ON-SCREEN PRIVACY BLUR</text>
        <text x="204" y="25" class="font-sans" font-size="11px" fill="#f87171">Auto-frosted blur on credit card field</text>
        
        <!-- Masked blurred field simulation -->
        <rect x="14" y="38" width="280" height="26" rx="4" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(239, 68, 68, 0.2)" />
        <text x="24" y="55" class="font-mono" font-size="13px" fill="#ef4444">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4242</text>
        <text x="310" y="55" class="font-mono" font-size="10px" fill="#94a3b8">Zero Plaintext to AI</text>
      </g>

      <!-- Bottom HUD Status Bar -->
      <g transform="translate(0, 290)">
        <rect width="480" height="28" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" />
        <circle cx="14" cy="14" r="4" fill="#10b981" />
        <text x="24" y="18" class="font-mono" font-size="10px" fill="#94a3b8">DOM_X HUD: <tspan fill="#34d399">ACTIVE</tspan> &bull; 18 Targets &bull; 60 FPS Sync &bull; $0.00 Cost</text>
      </g>
    </g>
  </g>
</svg>
